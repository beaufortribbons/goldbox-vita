[sdl]
fullscreen=true
fulldouble=false
fullresolution=960x544
windowresolution=original
output=surface
autolock=false
sensitivity=100
waitonerror=false
priority=higher,normal
mapperfile=
usescancodes=true

[dosbox]
language=
machine=svga_s3
captures=capture
memsize=16

[render]
frameskip=0
aspect=true
scaler=normal2x

[cpu]
core=dynamic
cputype=auto
cycles=2800
cycleup=10
cycledown=20

[mixer]
nosound=false
rate=22050
blocksize=2048
prebuffer=100

[midi]
mpu401=intelligent
mididevice=none
midiconfig=

[sblaster]
sbtype=sb1
sbbase=220
irq=7
dma=1
hdma=5
sbmixer=true
oplmode=auto
oplemu=default
oplrate=22050

[gus]
gus=false

[speaker]
pcspeaker=true
pcrate=22050
tandy=auto
tandyrate=22050
disney=false

[joystick]
joysticktype=none

[serial]
serial1=disabled
serial2=disabled
serial3=disabled
serial4=disabled

[dos]
xms=true
ems=true
umb=true
keyboardlayout=auto

[ipx]
ipx=false

[autoexec]
@echo off
mount c ux0:data/goldbox/gateway
c:
if not exist save mkdir save
set BLASTER=A220 I7 D1 T1
rem The game turns all sound off unless this INT 66h driver is resident (GOG's GO.BAT loads it too)
sblaster > nul
cls
game UseStart
